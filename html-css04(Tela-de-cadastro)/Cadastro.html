<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="Style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>

<body>

    <div class="sign">

        <h3>Criar conta</h3>

        <form action="/Enviar" method="post">

            <label for="usuario">Usuário:</label>
            <input type="text" id="usuario" placeholder="Crie seu usuário">

            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="Coloque seu e-mail">

            <label for="password">Senha:</label>
            <input type="password" id="password" placeholder="Crie sua senha">

            <div class="group">

                <div>
                    <label for="date">Data de nascimento:</label>
                    <input type="date" id="date">
                </div>

                <div>
                    <label for="genero">Gênero:</label>

                    <select id="genero">
                        <option value="none">Selecione</option>
                        <option value="Male">Homem</option>
                        <option value="Female">Mulher</option>
                        <option value="Other">Outros</option>
                    </select>
                </div>

            </div>

            <div class="terms">
                <input type="checkbox" id="terms">

                <label for="terms">
                    Clique aqui para aceitar os
                    <a href="Termos.html">termos de uso</a>
                    e a
                    <a href="Privacidade.html">política de privacidade</a>.
                </label>
            </div>

            <button type="submit">Cadastre-se</button>

        </form>

        <p>Já tem uma conta? <a href="Login.html">Entre</a></p>

    </div>

</body>
</html>
